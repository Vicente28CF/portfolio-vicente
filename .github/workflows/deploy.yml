name: Deploy

on:
  push:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  deploy-api:
    name: Deploy API → Render
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.API_HEALTH_URL }}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Attempt $i: status $STATUS — waiting..."
            sleep 5
          done
          echo "API failed to respond after 30 attempts"
          exit 1

  deploy-web:
    name: Deploy Web → Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        run: |
          npx vercel@latest deploy apps/web \
            --prod \
            --token "${{ secrets.VERCEL_TOKEN }}" \
            --env NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}" \
            --yes
